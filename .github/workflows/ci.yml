name: Workbench verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: browser
          POSTGRES_PASSWORD: browser-local-fixture
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U browser -d workbench" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_POSTGRES_DSN: postgresql://browser:browser-local-fixture@127.0.0.1:5432/workbench
      ANONYMIZED_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.11"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-browser-use.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: frontend
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: adapters/playwright-mcp
      - name: Install the compatibility browser
        run: |
          node adapters/playwright-mcp/node_modules/playwright/cli.js install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("./adapters/playwright-mcp/node_modules/playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Core, PostgreSQL, browser and operator UI
        env:
          RUN_BROWSER_TESTS: "1"
          RUN_BROWSER_USE_TESTS: "1"
          RUN_MCP_TESTS: "1"
          RUN_UI_TESTS: "1"
        run: python -m unittest discover -s tests -v
